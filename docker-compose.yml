# Local development services.
#
# The app itself only needs PostgreSQL (see README). Redis is OPTIONAL —
# without REDIS_URL the app runs on in-process LocMem. Bring Redis up when
# you want the Phase 2+ caches and cross-worker rate limits locally:
#
#   docker compose up -d redis
#   export REDIS_URL=redis://localhost:6379/0
#
# A cold start is a cold cache — nothing more.
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Cache only — no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
